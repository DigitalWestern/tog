# Tog company policy — the deny list a security team enforces.
#
# Install as ~/.tog/policy.toml (or point TOG_POLICY at it) on build
# machines, commit it as .tog/policy.toml at a repository root, or hand
# it to the admission gate: `tog audit --policy policy-company.toml`.
# Committing it means it has to be tracked: `.tog/` is half record and half
# cache, so ignore `**/.tog/*` and un-ignore `**/.tog/policy.toml` and
# `**/.tog/closures/` (the `**/` catches a monorepo's per-subproject
# directories). The stanza and the reasoning are in the README, under
# "What .tog/ holds, and what to commit".
# Policies union: this file can only add denials to whatever the machine and
# project already deny. Every kind named here is one of policy::KINDS; a typo
# is refused at parse time, never ignored.
#
# `strict` is deliberately not set. strict = true refuses every exception
# kind, including the routine ones listed at the bottom, and would turn most
# real projects red for reasons that are not security findings. Deny by
# kind instead; use `tog --strict` or TOG_STRICT=1 for a
# one-off fully strict build.

deny = [
    # A package's install lifecycle script (npm postinstall, node-gyp rebuild,
    # ...) failed but the extracted package was kept. What is on disk is not
    # what the package's author tested, and native code may be missing or
    # half-built. Denied: a failed build step must fail the build.
    "install-script-failed",

    # A lockfile carried only a legacy SHA-1 integrity for a package; tog
    # verified it, but SHA-1 collisions are practical, so the lock does not
    # pin the bytes it claims to. Denied: re-lock to get SHA-512 integrity.
    "weak-integrity",

    # A package was projected as a writable copy-on-write clone (declared in
    # "tog": {"mutablePackages": [...]}) whose runtime contents tog
    # cannot attest. Denied: what runs is not what the closure recorded.
    "unattested-mutable-state",

    # A manifest named a private index or an index-like option (a Poetry or
    # uv source, --extra-index-url, --find-links). tog records the option
    # but does not follow it: every package still resolves from the public
    # registry. A package the project meant to take from its private index
    # was therefore taken from the public one instead, which is the
    # dependency-confusion shape. Denied until the private index is either
    # removed from the manifest or served through an approved mirror that
    # tog resolves from.
    "unattested-index",

    # A dependency was taken from a git repository rather than a registry:
    # no registry provenance, no published artifact hash. Denied: vendor a
    # release or publish it to an approved registry.
    "git-dependency",

    # The lock's recorded content digest did not match its source manifest:
    # the lock was produced from a different manifest than the one being
    # built. Denied: re-lock so the lock and the manifest agree.
    "lock-disagreement",

    # A package's install-time download was deliberately skipped
    # (puppeteer- and cypress-class packages, through their documented skip
    # switch): the package is present but the binary it wanted is not in
    # the closure. Denied: declare the artifact (url + sha256) so it is
    # fetched through the verified cache, or drop the package. A download tog
    # provisions itself (electron) or a declared artifact that fails to
    # fetch records nothing: the sync fails instead.
    "artifact-not-provisioned",

    # The Rust toolchain is a directory on the building machine
    # (`[toolchain] path` in rust-toolchain.toml), locked by its content
    # hash, not a release tog pins and verifies. The lock proves the tree did
    # not change since it was locked, not where it came from. Denied: name a
    # channel so the compiler is a pinned, verified release.
    "external-toolchain",
]

# Deliberately NOT denied. These kinds are recorded so the audit can count
# them, but they are not security findings:
#
#   file-collision                   two wheels shipped the same path; the
#                                    later one won. Both are locked and
#                                    hash-verified; this is a packaging
#                                    hygiene issue, not a provenance gap.
#   requirement-skipped              a project-local or direct-reference
#                                    requirement was left to the project;
#                                    nothing unverified entered the store.
#   skipped-optional                 an optional group or extra was not
#                                    requested; fewer packages, not unknown
#                                    ones.
#   built-from-source                a package that ships prebuilt binaries
#                                    was compiled from its (hash-verified)
#                                    source in the network-denied sandbox;
#                                    strictly more reproducible, not less.
#   artifact-provisioned             tog itself fetched an install-time
#                                    artifact and verified it against the
#                                    package's own manifest (trust on first
#                                    use). Teams that require a project-
#                                    declared sha256 for every binary may add
#                                    this kind to the list above.
#   unattested-cargo-lock            Cargo.lock was generated by the store's
#                                    pinned cargo because the source shipped
#                                    none; every crate in it is still
#                                    hash-verified. Commit the lock to make
#                                    this disappear.
#   host-build-inputs                a native extension (a Ruby gem's) did
#                                    not build against the host's C runtime
#                                    alone, so it was rebuilt against the
#                                    machine's whole /usr: the object depends
#                                    on which -dev packages that host has,
#                                    and another machine may build different
#                                    bytes. Every input is still verified;
#                                    only reproducibility across hosts is
#                                    lost. Teams that need identical objects
#                                    on every builder may add this kind to
#                                    the list above and provide the library
#                                    another way.

# Closure signing. `tog audit` accepts only records signed by a key in
# the machine policy's [signing] table; a project or --policy copy of this
# file can only remove keys from that table, never add one, and without the
# table at machine scope the gate is not configured (exit 2). Generate a key
# on the signing machine with `tog keygen <path>`, set
# TOG_SIGNING_KEY=<path> where `tog` runs, and paste the table
# it prints here:
#
# [signing]
# trusted = ["ed25519:<64 hex>"]
