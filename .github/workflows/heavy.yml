# Weekly, and by hand from the Actions tab: the heavy network tests
# (`cargo test -- --ignored`) and tests/acceptance.sh. They download the
# pinned toolchains and resolve real packages from PyPI, npm, crates.io,
# the Go proxy, RubyGems, Hex and NuGet, so they prove every ecosystem
# syncs, builds in the sandbox and runs end to end, not just its fixtures.
# That takes about 40 minutes on a 12-core machine, about 20 here with the
# tests split over four runners (`e2e`), and depends on those
# registries being up, so it is not on every PR; ci.yml runs the offline
# suite there. It does run on a pull request in two cases, decided by the
# `gate` job below:
#   - the PR changes a file listed in `gate` (tar extraction, downloads,
#     the sandbox, the toolchain providers and catalogs, each tailor's
#     unpack.rs or unpack/, Go's zip hash, self-update, Cargo.lock, or the heavy suite itself). Real toolchain archives carry shapes
#     no fixture had: #316 was green in ci.yml and broke 15 targets here.
#   - the PR has the `heavy` label. Adding it starts a run (unless the
#     files above already woke the suite and that run for this commit is
#     still queued or going), and every later push to the PR runs again
#     until the label comes off.
#     heavy-unlabel.yml takes it off after a green run.
# A PR that needs neither but edits a test file holding `#[ignore]` tests
# gets the `changed` job: the ignored tests of just those files, so an
# edited end-to-end test never merges without having run once.
# A PR that edits shared test inputs (`tests/common/`, fixtures, helpers)
# without naming a test target gets the whole suite instead: those files
# change what the ignored end-to-end tests prove, so the `changed` job
# would test nothing, or only part of what the change affects.
# `tests/size_baseline.txt` and `tests/install.sh` do not count: only the
# offline suite in ci.yml reads them.
# Weekly rather than nightly because the repository is
# private and a nightly run of this length would use most of the Actions
# minutes a free plan includes; change `cron` to `"0 6 * * *"` for nightly.
#
# Elixir is the one ecosystem the ubuntu runner cannot prove: the only
# Linux OTP in src/tailors/elixir/catalog.toml needs glibc 2.43 (Fedora 44)
# and ubuntu-22.04 has 2.35 (docs/human/LIMITATIONS.md "Unpinned host build
# inputs"), so the `e2e` job skips its end-to-end test by name, the
# `acceptance` job skips its step (TOG_ACCEPT_SKIP_ELIXIR), and the
# `elixir` job runs that test in a Fedora 44 container. An OTP built on an older baseline, which would end
# the split, is #300.
#
# The last green run's date goes in STATUS.md by hand ("Last green heavy
# run"); that date is when the end-to-end claims there were last true.
name: heavy

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # Pull requests only: says whether this PR needs the heavy suite.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      # actions: read lists this workflow's runs for the head commit
      # (the `labeled` branch below).
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'heavy') }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The files whose changes need the heavy suite, as one regex:
          # tar extraction and downloads, the sandbox every build runs in,
          # the toolchain providers that extract real archives, the
          # catalogs that pin those archives, Cargo.lock (the decompression
          # crates), and the heavy suite itself. The tailors and `tog
          # self-update` extract too: each tailor keeps its archive, zip and
          # unzip calls in its own unpack.rs (or unpack/), which
          # tests/architecture.rs enforces against this regex, so those
          # files and selfupdate.rs are watched, not every tailor file
          # (#325, #557). dirhash.rs hashes Go module zips.
          watched='^(src/kernel/(archive|dirhash|fetch|sandbox)[^/]*|src/kernel/(archive|dirhash|fetch|sandbox)/.*|src/kernel/provider/.*|src/tailors/[^/]+/unpack(\.rs|/.*)|src/commands/selfupdate\.rs|src/.*catalog\.toml|Cargo\.lock|\.github/workflows/heavy\.yml|tests/acceptance\.sh)$'
          tests=""
          # Sets `run` (and `tests`) from the PR's files alone, the way a
          # push decides. A renamed file counts under its old name too. If
          # the API call fails, run: a missed heavy run is the costlier
          # mistake.
          by_paths() {
            listed=yes
            if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)'); then
              echo "::warning::could not list the PR's files; running the heavy suite"
              run=yes
              listed=no
            elif grep -qE "$watched" <<< "$files"; then
              run=yes
            else
              run=no
              # The test files this PR touches, as bare target names
              # (`tests/gc.rs` is `gc`), for the `changed` job. Only names
              # made of letters, digits and `_` pass, so nothing a PR can
              # name reaches a shell as anything but a test target.
              tests=$(grep -oE '^tests/[A-Za-z0-9_]+\.rs$' <<< "$files" \
                | sed -E 's#^tests/(.*)\.rs$#\1#' | sort -u | tr '\n' ' ' || true)
              # Shared test inputs (`tests/common/`, fixtures, helpers)
              # change what the ignored end-to-end tests prove without
              # naming a test target, so the `changed` job would test
              # nothing, or only part of what the change affects. Run the
              # whole heavy suite for those instead of silently
              # undertesting. (`tests/acceptance.sh` is already in
              # `watched` above, so it never reaches this branch.)
              # Two files under tests/ are no end-to-end input: the size
              # ratchet's baseline, which most refactors edit, and
              # install.sh. Only ci.yml's offline suite reads them.
              # No `-q` on the second grep: it would stop at its first
              # match, and on a long list the first grep then dies of a
              # closed pipe, which `pipefail` reads as "no match".
              if grep -E '^tests/' <<< "$files" | grep -vE '^tests/([A-Za-z0-9_]+\.rs|size_baseline\.txt|install\.sh)$' > /dev/null; then
                run=yes
                tests=""
              fi
            fi
          }
          # Says whether another pull_request run of this workflow for the
          # head commit is queued or running. A weekly or by-hand run is
          # not one: heavy-unlabel.yml acts only on pull_request runs, so
          # a label deferred to one of those would never be run again. If the API call fails, says no: the
          # caller then runs, and a missed heavy run is the costlier mistake.
          other_run_active() {
            local ids
            if ! ids=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/heavy.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
                --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.status != \"completed\") | .id"); then
              echo "::warning::could not list this commit's heavy runs; running the heavy suite"
              return 1
            fi
            [ -n "$ids" ]
          }
          if [ "$ACTION" = labeled ]; then
            if [ "$ADDED_LABEL" = heavy ]; then
              # When the files already woke the suite and a run for this
              # commit is still queued or going, the push that brought the
              # commit started it. Running again would cancel that run
              # (the e2e job's concurrency group) and restart it on the
              # same commit (#324). Otherwise (that run failed, was
              # cancelled, or is done) adding the label runs it again, as
              # heavy-unlabel.yml promises. Later pushes run it through
              # HAS_LABEL as usual.
              by_paths
              if [ "$listed" = yes ] && [ "$run" = yes ] && other_run_active; then
                echo "a heavy run for $HEAD_SHA is already queued or running; not starting another"
                run=no
              else
                run=yes
              fi
              tests=""
            else
              # Some other label was added: nothing about the code changed.
              run=no
            fi
          elif [ "$HAS_LABEL" = true ] && [ "$ACTION" != opened ]; then
            run=yes
          else
            # A PR opened with `heavy` already on it also gets a `labeled`
            # event, and that run starts the suite. Deciding `opened` by
            # the files alone keeps the two from both running and one
            # cancelling the other.
            by_paths
          fi
          echo "run=$run tests=$tests"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  # The ignored tests, in four shards on four runners at once: one runner
  # took about 50 minutes for them all. Within a shard, one test at a
  # time: tests that realize through a child hold
  # supervise::SUPERVISION_TEST_LOCK, and tests that set TOG_STORE hold
  # store::STORE_ENV_LOCK. Separate runners share nothing, so the shards
  # need no lock between them. The lists are balanced on the 2026-10-03
  # green run's times (seconds per file in brackets).
  e2e:
    needs: gate
    # `gate` is skipped outside pull requests, so `!cancelled()` keeps
    # the weekly and by-hand runs from being skipped along with it.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.gate.outputs.run == 'yes') }}
    name: e2e (${{ matrix.shard }})
    strategy:
      # A red shard does not stop the others, like --no-fail-fast.
      fail-fast: false
      matrix:
        shard: [node, rust, python, other]
    # The weekly and by-hand runs go one shard at a time: a shard started
    # while the same shard of another run is going waits for it. On a
    # pull request a new push cancels that PR's older run, which tested
    # code that is gone. One group per shard: a group holds one running
    # and one waiting job, so four shards in one group would cancel each
    # other. The group is per job rather than for the whole workflow, so
    # a run that `gate` skips (another label added) cancels nothing.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('heavy-pr-{0}-{1}', github.event.pull_request.number, matrix.shard) || format('heavy-{0}', matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    # The longest shard took about 11 minutes of tests on the 2-vCPU
    # runner; the sdist, cargo and node-gyp builds are CPU-bound and a
    # cold cache adds the whole build. This leaves room.
    timeout-minutes: 100
    env:
      # A sandbox check that cannot run fails instead of skipping.
      TOG_SANDBOX_TESTS: required
      # The test files each named shard runs. `other` runs every file in
      # tests/ not named here, so a new test file is never left out.
      # node: npm_scripts [538] npm_lock_import [10] electron_provision [4]
      # run_scripts [10] git_deps [28] gc [55].
      SHARD_NODE: npm_scripts npm_lock_import electron_provision run_scripts git_deps gc
      # rust: toolchain_lock [402] cargo_e2e [274] catalog_upstream
      # (downloads about 100 MB).
      SHARD_RUST: toolchain_lock cargo_e2e catalog_upstream
      # python, plus the ignored unit tests in src/ (--lib, [151]):
      # source-package builds [299] in --lib, fmt_e2e [145], native_libs
      # [18], python_select [8], manifests [6], wheel_data [2],
      # linux_python [1], kernel_smoke [0].
      SHARD_PYTHON: fmt_e2e native_libs python_select manifests wheel_data linux_python kernel_smoke
      # other, about 570 seconds: deps_e2e [250] go_e2e [118] dotnet_e2e
      # [114] ruby_e2e [86] sandbox_deny [4] elixir_e2e and the rest.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # zlib1g-dev is the host development package the Ruby host-fallback
      # test (tests/ruby_e2e.rs) builds a native gem against; without it
      # that test has nothing to prove and fails under TOG_SANDBOX_TESTS.
      - name: Install the Linux sandbox and the host headers the suite needs
        run: sudo apt-get update && sudo apt-get install -y bubblewrap zlib1g-dev
      # One cache for the four shards and acceptance (#423). The key
      # is otherwise the job id, so acceptance built cold.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: heavy
      - run: cargo build --locked
      # Every later step sees these. Scratch stores and toolchains go on
      # the runner's disk rather than /tmp. TOG_STORE is the store for the
      # native_libs suite, which opens it in-process and fails without it.
      # Most e2e suites make their own
      # store under TMPDIR. (Job-level `env` cannot read `runner.temp`.)
      - name: Scratch directory on the runner disk
        run: |
          mkdir -p "$RUNNER_TEMP/tog/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tog/tmp" >> "$GITHUB_ENV"
          echo "TOG_STORE=$RUNNER_TEMP/tog/store" >> "$GITHUB_ENV"
      # --no-fail-fast so one red suite does not hide the ones after it.
      - name: Ignored end-to-end tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          extra=()
          case "$SHARD" in
            node) files=$SHARD_NODE ;;
            rust) files=$SHARD_RUST ;;
            python)
              files=$SHARD_PYTHON; extra=(--lib --bins)
              # Store OTP needs Fedora's glibc. Its library door tests run
              # below in the Fedora job with the integration suite.
              skip=(--skip tailors::elixir::resolve::tests)
              ;;
            other)
              files=
              named=" $SHARD_NODE $SHARD_RUST $SHARD_PYTHON "
              for path in tests/*.rs; do
                name=$(basename "$path" .rs)
                if [[ "$named" != *" $name "* ]]; then files="$files $name"; fi
              done
              # See the header: no Linux OTP runs on this glibc.
              skip=(--skip elixir_sync_sandboxed_build_and_run)
              ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          args=("${extra[@]}")
          for name in $files; do args+=(--test "$name"); done
          set -x
          # Two tests at a time within each suite: the suites keep their
          # scratch stores, HOMEs and registries per test, and env changes
          # behind locks, and a full local run at 2 passed (#465).
          cargo test --locked --no-fail-fast "${args[@]}" -- --ignored --test-threads=2 ${skip[@]+"${skip[@]}"}
      # The runner disk is about 14 GB; the stores and target/ use most of
      # it. This shows how close a run came.
      - name: Disk after the run
        if: ${{ always() }}
        run: df -h "$RUNNER_TEMP" && du -sh "$RUNNER_TEMP/tog"/* 2>/dev/null || true

  # tests/acceptance.sh, once, after every shard has finished. It runs
  # when a shard failed too, so one red suite does not hide the other.
  # heavy-unlabel.yml looks for this job by name.
  acceptance:
    needs: [gate, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled' }}
    name: acceptance
    # Its own group (#425). Sharing the node shard's group let an older
    # run's acceptance, queued late, cancel a newer run's node shard. A
    # newer push still skips this job when it cancels the older shards
    # (the `if:` above); one already running finishes on the old commit.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('heavy-pr-{0}-acceptance', github.event.pull_request.number) || 'heavy-acceptance' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    # About 3 minutes on the runner (2026-10-03), plus the build.
    timeout-minutes: 60
    env:
      TOG_SANDBOX_TESTS: required
      # See the header: no Linux OTP runs on this glibc.
      TOG_ACCEPT_SKIP_ELIXIR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the Linux sandbox and the host headers the suite needs
        run: sudo apt-get update && sudo apt-get install -y bubblewrap zlib1g-dev
      # One cache for the four shards and acceptance (#423). The key
      # is otherwise the job id, so acceptance built cold.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: heavy
      - run: cargo build --locked
      - name: Scratch directory on the runner disk
        run: |
          mkdir -p "$RUNNER_TEMP/tog/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tog/tmp" >> "$GITHUB_ENV"
          echo "TOG_STORE=$RUNNER_TEMP/tog/store" >> "$GITHUB_ENV"
      - name: Acceptance checklist
        run: bash tests/acceptance.sh
      - name: Disk after the run
        if: ${{ always() }}
        run: df -h "$RUNNER_TEMP" && du -sh "$RUNNER_TEMP/tog"/* 2>/dev/null || true

  # A PR the gate did not send to the whole suite, but which edits test
  # files: run the `#[ignore]` tests of just those files. Without this an
  # edited end-to-end test merges having never run, and the first to find
  # it broken is the weekly run.
  changed:
    needs: gate
    if: ${{ github.event_name == 'pull_request' && needs.gate.outputs.run == 'no' && needs.gate.outputs.tests != '' }}
    concurrency:
      group: heavy-changed-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      TOG_SANDBOX_TESTS: required
      CHANGED: ${{ needs.gate.outputs.tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Decided before anything is installed or built: most edited test
      # files hold no ignored test, and then the job ends here.
      - id: pick
        name: The edited test files that hold ignored tests
        run: |
          set -euo pipefail
          picked=""
          for name in $CHANGED; do
            file="tests/$name.rs"
            # A deleted file has nothing to run.
            if [ -f "$file" ] && grep -qE '^[[:space:]]*#\[ignore' "$file"; then
              picked="$picked $name"
            fi
          done
          echo "picked=$picked"
          echo "picked=$picked" >> "$GITHUB_OUTPUT"
      - name: Install the Linux sandbox and the host headers the suite needs
        if: steps.pick.outputs.picked != ''
        run: sudo apt-get update && sudo apt-get install -y bubblewrap zlib1g-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.pick.outputs.picked != ''
      - name: Scratch directory on the runner disk
        if: steps.pick.outputs.picked != ''
        run: |
          mkdir -p "$RUNNER_TEMP/tog/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tog/tmp" >> "$GITHUB_ENV"
          echo "TOG_STORE=$RUNNER_TEMP/tog/store" >> "$GITHUB_ENV"
      # Every picked file runs even after one fails, like --no-fail-fast.
      # Elixir is skipped by name here for the reason in the header; the
      # `elixir` job runs it when tests/elixir_e2e.rs is among the files.
      - name: Ignored tests of the edited files
        if: steps.pick.outputs.picked != ''
        env:
          PICKED: ${{ steps.pick.outputs.picked }}
        run: |
          set -uo pipefail
          failed=""
          for name in $PICKED; do
            echo "::group::cargo test --test $name -- --ignored"
            cargo test --locked --test "$name" -- --ignored --test-threads=2 \
              --skip elixir_sync_sandboxed_build_and_run || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::ignored tests failed in:$failed"
            exit 1
          fi

  # The Elixir end-to-end test, on the one baseline its OTP runs on (see
  # the header). It runs whenever `e2e` does, and when a PR edits the test
  # itself. `--privileged` is what lets bubblewrap make its namespaces
  # inside the container.
  elixir:
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.gate.outputs.run == 'yes' || contains(format(' {0} ', needs.gate.outputs.tests), ' elixir_e2e ')) }}
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('heavy-elixir-pr-{0}', github.event.pull_request.number) || 'heavy-elixir' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    container:
      image: fedora:44
      options: --privileged
    timeout-minutes: 90
    steps:
      # git first, so checkout clones rather than downloading an archive.
      # The image is minimal: tar and the decompressors tog and the cache
      # action call are not in it.
      - name: Install the compiler, the sandbox and the host tools
        run: dnf install -y gcc git tar gzip xz bzip2 unzip zstd findutils util-linux jq bubblewrap rustup
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rust-toolchain.toml names the toolchain; cargo installs it on
      # first use.
      - name: Install rustup
        run: |
          rustup-init -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      # A container job's steps run as root, and root can write into a
      # read-only store object, which the test asserts nobody can. So root
      # builds, and the test binary runs as an ordinary user with a home
      # and a scratch directory of its own.
      - name: Elixir end-to-end test, as an ordinary user
        run: |
          set -euo pipefail
          exe=$(cargo test --locked --test elixir_e2e --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "elixir_e2e") | .executable')
          test -x "$exe"
          libexe=$(cargo test --locked --lib --no-run --message-format=json \
            | jq -r 'select(.executable != null and (.target.kind | index("lib"))) | .executable')
          test -x "$libexe"
          useradd --create-home tester
          scratch="$RUNNER_TEMP/tog-elixir"
          mkdir -p "$scratch"
          chown tester: "$scratch"
          runuser -u tester -- env HOME=/home/tester TMPDIR="$scratch" \
            TOG_SANDBOX_TESTS=required "$exe" --ignored --test-threads=1
          runuser -u tester -- env HOME=/home/tester TMPDIR="$scratch" \
            TOG_SANDBOX_TESTS=required "$libexe" tailors::elixir::resolve::tests \
            --ignored --test-threads=2
