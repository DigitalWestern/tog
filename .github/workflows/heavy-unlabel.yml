# When heavy.yml goes green on a pull request it ran for, take the `heavy`
# label off that PR. The label runs the hour-long suite on every push while
# it is on (heavy.yml's `gate`); one green run is what it was added for, so
# a forgotten label stops costing a run per push. Add it again to rerun.
#
# A run counts only if its acceptance job passed: a `labeled` event for
# some other label also finishes green, with every heavy job skipped, and
# that proved nothing. The weekly and by-hand runs have no PR and are left
# alone.
#
# GitHub runs a `workflow_run` workflow from the default branch's copy, so
# a change to this file takes effect once it is on main.
name: heavy-unlabel

on:
  workflow_run:
    workflows: [heavy]
    types: [completed]

permissions:
  contents: read

jobs:
  unlabel:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          acceptance=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" \
            --jq '.jobs[] | select(.name == "acceptance") | .conclusion')
          if [ "$acceptance" != success ]; then
            echo "acceptance did not pass in run $RUN ('$acceptance'); the label stays"
            exit 0
          fi
          # GitHub leaves pull_requests empty in some cases; find the PR by
          # its branch then.
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$HEAD_OWNER:$HEAD_BRANCH" \
              --jq '.[0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "no open pull request for $HEAD_OWNER:$HEAD_BRANCH"
            exit 0
          fi
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if ! grep -qx heavy <<< "$labels"; then
            echo "#$PR has no heavy label"
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/heavy" > /dev/null
          echo "removed the heavy label from #$PR after green run $RUN"
