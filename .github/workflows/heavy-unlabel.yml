# When heavy.yml goes green on a pull request it ran for, take the `heavy`
# label off that PR. The label runs the hour-long suite on every push while
# it is on (heavy.yml's `gate`); one green run is what it was added for, so
# a forgotten label stops costing a run per push. Add it again to rerun.
#
# A run counts only if its acceptance job passed: a `labeled` event for
# some other label also finishes green, with every heavy job skipped, and
# that proved nothing. The weekly and by-hand runs have no PR and are left
# alone.
#
# A run that proved nothing (acceptance failed, was cancelled or skipped)
# may be one a `heavy` label deferred to: heavy.yml's gate does not start
# a second run while one for the commit is queued or going (#324). When
# that run fails, or was only another label's run with every job skipped,
# the label would sit having started nothing (#557). So once no heavy run
# for the commit is still going, the newest run whose gate deferred is
# run again, and its gate now starts the suite. A run only defers while
# another is going, so this ends.
#
# GitHub runs a `workflow_run` workflow from the default branch's copy, so
# a change to this file takes effect once it is on main.
name: heavy-unlabel

on:
  workflow_run:
    workflows: [heavy]
    types: [completed]

permissions:
  contents: read

jobs:
  unlabel:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      # actions: write runs a deferred heavy run again.
      actions: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          acceptance=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" \
            --jq '.jobs[] | select(.name == "acceptance") | .conclusion')
          # GitHub leaves pull_requests empty in some cases; find the PR by
          # its branch then.
          if [ -z "$PR" ]; then
            PR=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f "head=$HEAD_OWNER:$HEAD_BRANCH" \
              --jq ".[] | select(.head.ref == \"$HEAD_BRANCH\") | .number" | head -n 1)
          fi
          if [ -z "$PR" ]; then
            echo "no open pull request for $HEAD_OWNER:$HEAD_BRANCH"
            exit 0
          fi
          # The green run vouches for one commit and one label request. A
          # push since, or the label added again after the run started
          # when that started a new run, asks for a new run: leave the
          # label for that one.
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "#$PR moved from $HEAD_SHA to $head since run $RUN; the label stays"
            exit 0
          fi
          labels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if ! grep -qx heavy <<< "$labels"; then
            echo "#$PR has no heavy label"
            exit 0
          fi
          if [ "$CONCLUSION" != success ] || [ "$acceptance" != success ]; then
            echo "run $RUN proved nothing ('$CONCLUSION', acceptance '$acceptance'); the label stays"
            # Any heavy run for this commit still going finishes later and
            # brings this workflow back; act only once none is.
            if ! runs=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/heavy.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
                --jq '.workflow_runs[] | "\(.id) \(.status)"'); then
              echo "the runs for $HEAD_SHA could not be listed; nothing run again"
              exit 0
            fi
            if grep -v ' completed$' <<< "$runs" | grep -q .; then
              echo "a heavy run for $HEAD_SHA is still going"
              exit 0
            fi
            # Newest first, as the API lists them.
            for id in $(cut -d' ' -f1 <<< "$runs"); do
              gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "gate") | .id' || true)
              [ -n "$gate" ] || continue
              log=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$gate/logs" || true)
              if grep -q 'already queued or running; not starting another' <<< "$log"; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun" > /dev/null
                echo "run $id deferred the heavy label to a run that proved nothing; ran it again"
                exit 0
              fi
            done
            exit 0
          fi
          labeled=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "heavy") | .created_at' | tail -n 1)
          # Both are UTC ISO 8601 with a Z, so they compare as strings.
          # A label added while this run was going started a new run only
          # if heavy.yml's gate let it: when the PR's files had already
          # started this run, the gate skips the label (#324) and this
          # green run is the one it asked for. So the label stays only
          # while another heavy run for this commit is queued or going.
          # If that lookup fails, the label stays, as it did before.
          if [[ "$labeled" > "$RUN_STARTED" ]]; then
            if ! active=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/heavy.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
                --jq ".workflow_runs[] | select(.id != $RUN) | select(.status != \"completed\") | .id"); then
              echo "heavy was added again at $labeled and the runs for $HEAD_SHA could not be listed; the label stays"
              exit 0
            fi
            if [ -n "$active" ]; then
              echo "heavy was added again at $labeled, after run $RUN started at $RUN_STARTED, and run $(head -n 1 <<< "$active") is going; the label stays"
              exit 0
            fi
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/heavy" > /dev/null
          echo "removed the heavy label from #$PR after green run $RUN"
