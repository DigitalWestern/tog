[package]
name = "tog"
version = "0.1.0"
edition = "2021"
description = "One command for every package manager: pinned toolchains, locked graphs, an immutable store"
repository = "https://github.com/DigitalWestern/tog"
homepage = "https://github.com/DigitalWestern/tog"
readme = "README.md"
keywords = ["package-manager", "toolchain", "lockfile", "reproducible", "store"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io: the `tog` name there belongs to an unrelated
# process-multiplexer crate, and this repository carries no license file yet. Pick a
# crate name and a license, then remove this line. `cargo install --git` and
# `cargo install --path .` work regardless.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
ureq = "2"
ring = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
flate2 = "1"
liblzma = { version = "0.4", features = ["static"] }

[profile.release]
strip = true
