[package]
name = "tog"
version = "0.1.0"
edition = "2021"
# Matches rust-toolchain.toml: the one compiler CI tests and releases build with.
rust-version = "1.98.1"
description = "One command for every package manager: pinned toolchains, locked graphs, an immutable store"
repository = "https://github.com/DigitalWestern/tog"
homepage = "https://github.com/DigitalWestern/tog"
readme = "README.md"
license = "MIT"
keywords = ["package-manager", "toolchain", "lockfile", "reproducible", "store"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io: the `tog` name there belongs to an unrelated
# process-multiplexer crate. Pick a crate name, then remove this line.
# `cargo install --git` and `cargo install --path .` work regardless.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
ureq = "2"
ring = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
flate2 = "1"
bzip2 = "0.4"
liblzma = { version = "0.4", features = ["static"] }
unicode-normalization = "0.1"
# #313: full Unicode case folding for the APFS collision check (SS/ß,
# Turkish I, Greek final forms); a one-line swap from `to_lowercase`.
caseless = "0.2"
# #314: the invisible-name check refuses by Unicode general category
# (Cc, Cf) instead of a listed set; already in the graph via ureq/url/idna.
icu_properties = "2"
# The resolution proxy's upstream TLS client (a pinned root set and the ring
# provider named explicitly) and the server half that terminates intercepted
# tunnels. Already in the graph through ureq, with ureq's exact feature set
# so no second crypto backend is compiled.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# The production upstream root set; ureq already links it (0.26 re-exports 1).
webpki-roots = "1"
# `RegistryProtocol` speaks in parsed URLs; already in the graph via ureq.
url = "2"
# The resolution proxy's per-process certificate authority and the leaf it
# mints per intercepted host (ECDSA P-256). The ring backend only (no
# aws-lc). The tests' fixture CA uses it too, so no private key is checked
# in.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Cargo workspace `members` globs, matched one path part at a time with the
# crate cargo itself expands them with (rust-lang/glob), so `[**]`, classes
# and the rest mean what they mean to cargo. tog walks the directories
# itself, without following symlinks; only `glob::Pattern` is used.
glob = "0.3"

[lints.rust]
# `--cfg tog_dead_code` makes the internal modules private, so rustc's
# dead-code lint sees what no command reaches (#247). CI's "No dead code"
# step runs it with `-D dead_code`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tog_dead_code)"] }

# CI runs `cargo clippy --locked --all-targets -- -D warnings`, so every
# clippy warning fails the build. These few are allowed project-wide.
[lints.clippy]
# Store and sandbox entry points take many explicit inputs on purpose, so
# each caller names what it passes; a params struct would only hide them.
too_many_arguments = "allow"
# Nested generic types (maps of vectors of tuples) read fine at their one
# use site; a `type` alias per site would add names nobody else uses.
type_complexity = "allow"

[profile.release]
strip = true
