[package]
name = "blanket"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
